<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__TITLE__</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        background: #0d1117;
        color: #c9d1d9;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      header {
        background: #161b22;
        border-bottom: 1px solid #30363d;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-shrink: 0;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        color: #e6edf3;
      }
      .counter {
        font-size: 13px;
        color: #8b949e;
        background: #21262d;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid #30363d;
      }
      .modelsel {
        background: #21262d;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 13px;
        font-family: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .nav-hint {
        margin-left: auto;
        font-size: 12px;
        color: #6e7681;
      }
      kbd {
        background: #21262d;
        border: 1px solid #30363d;
        border-radius: 4px;
        padding: 1px 6px;
        font-size: 12px;
        font-family: monospace;
      }
      .filterbar {
        background: #161b22;
        border-bottom: 1px solid #30363d;
        padding: 6px 20px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
        font-size: 12px;
        flex-wrap: wrap;
      }
      .filterbar button {
        background: #21262d;
        color: #8b949e;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 3px 10px;
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
      }
      .filterbar button.active {
        background: #21262d;
        border-color: #6e7681;
        color: #c9d1d9;
      }
      .grp {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .grp + .grp {
        margin-left: 14px;
        padding-left: 14px;
        border-left: 1px solid #30363d;
      }
      .glab {
        color: #6e7681;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .catbar {
        background: #0d1117;
        border-bottom: 1px solid #30363d;
        padding: 6px 20px;
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        flex-shrink: 0;
      }
      .catbar .clab {
        color: #6e7681;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-right: 4px;
      }
      .catchip {
        background: #21262d;
        color: #8b949e;
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 2px 9px;
        font-size: 11px;
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
      }
      .catchip:hover {
        border-color: #6e7681;
        color: #c9d1d9;
      }
      .catchip .n {
        color: #6e7681;
        margin-left: 3px;
      }
      .catchip.current {
        background: #21262d;
        border-color: #6e7681;
        color: #c9d1d9;
      }
      .catsub {
        color: #6e7681;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-left: 8px;
      }
      .content {
        flex: 1;
        overflow-y: auto;
        padding: 22px 30px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .card {
        border-radius: 8px;
        padding: 16px 20px;
        border: 1px solid #30363d;
      }
      .label {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 9px;
      }
      .prompt-card {
        background: #2d1b1b;
        border-color: #f8514955;
      }
      .prompt-card .label {
        color: #ff7b72;
      }
      .ref-id {
        text-transform: none;
        letter-spacing: 0;
        color: #8b949e;
        font-family: monospace;
        font-weight: 500;
      }
      .prompt-text {
        font-size: 15px;
        line-height: 1.55;
        color: #ffdcd7;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .resp-card {
        background: #161b22;
      }
      .resp-card .label {
        color: #8b949e;
      }
      .resp-text {
        font-size: 14px;
        line-height: 1.6;
        color: #c9d1d9;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .verdict {
        font-size: 13px;
        color: #8b949e;
        padding: 2px 2px;
      }
      .verdict b {
        color: #c9d1d9;
      }
      .verdict b.vfail {
        color: #ff7b72;
      }
      .verdict b.vpass {
        color: #7ee787;
      }
      details.reason-card {
        background: #12161c;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 0;
      }
      details.reason-card summary {
        cursor: pointer;
        padding: 12px 20px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #d2a8ff;
        list-style: none;
        user-select: none;
      }
      details.reason-card summary::-webkit-details-marker {
        display: none;
      }
      details.reason-card summary::before {
        content: "\25B8  ";
        color: #6e7681;
      }
      details.reason-card[open] summary::before {
        content: "\25BE  ";
      }
      details.reason-card .reason-text {
        padding: 0 20px 16px;
        font-size: 13px;
        line-height: 1.6;
        color: #b8a5d8;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-family: ui-monospace, monospace;
      }
      .empty {
        color: #6e7681;
        font-style: italic;
      }
      #cards {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      #cards[hidden] {
        display: none;
      }
      .empty-msg {
        color: #6e7681;
        font-style: italic;
        font-size: 15px;
      }
      .judges-card {
        background: #12161c;
      }
      .judges-card .label {
        color: #8b949e;
      }
      .judge {
        border-left: 2px solid #30363d;
        padding: 3px 0 8px 12px;
        margin-bottom: 10px;
      }
      .judge:last-child {
        margin-bottom: 0;
      }
      .judge.muted {
        opacity: 0.4;
      }
      .judge-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
        flex-wrap: wrap;
      }
      .judge-name {
        font-size: 12px;
        font-weight: 700;
        color: #e6edf3;
        font-family: monospace;
      }
      .judge-desc {
        font-size: 11px;
        color: #6e7681;
      }
      .jv {
        font-size: 11px;
        font-weight: 700;
        padding: 1px 8px;
        border-radius: 10px;
      }
      .jv-fail {
        background: #f8514933;
        color: #ff7b72;
        border: 1px solid #f8514966;
      }
      .jv-pass {
        background: #23863633;
        color: #7ee787;
        border: 1px solid #23863666;
      }
      .judge-reason {
        font-size: 12px;
        line-height: 1.5;
        color: #9d8bc0;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .clamped {
        max-height: 24em;
        overflow: hidden;
      }
      .more-toggle {
        margin-top: 10px;
        cursor: pointer;
        font-size: 12px;
        color: #6e7681;
        user-select: none;
      }
      .more-toggle:hover {
        color: #8b949e;
      }
      .filterbar button .cnt {
        color: #6e7681;
        margin-left: 3px;
      }
      .filterbar button.active .cnt {
        color: #c9d1d9;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>__TITLE__</h1>
      <select id="modelSel" class="modelsel"></select>
      <div class="counter" id="counter">0 / 0</div>
      <div class="nav-hint">
        <kbd>J</kbd> next · <kbd>K</kbd> prev · <kbd>⇧</kbd> by category
      </div>
    </header>
    <div class="filterbar">
      <span class="grp"
        ><span class="glab">questions</span>
        <button class="active" data-g="questions" data-v="hardno">
          hard no <span class="cnt"></span></button
        ><button class="active" data-g="questions" data-v="others">
          others <span class="cnt"></span></button
      ></span>
      <span class="grp"
        ><span class="glab">benchmark</span>
        <button class="active" data-g="source" data-v="HarmBench">
          harmbench <span class="cnt"></span></button
        ><button class="active" data-g="source" data-v="AILuminate">
          ailuminate <span class="cnt"></span></button
      ></span>
      <span class="grp"
        ><span class="glab">status</span>
        <button class="active" data-g="status" data-v="complied">
          fail <span class="cnt"></span></button
        ><button class="active" data-g="status" data-v="refused">
          pass <span class="cnt"></span></button
      ></span>
    </div>
    <div class="catbar" id="catbar">
      <span class="clab">benchmark categories:</span>
    </div>
    <div class="content">
      <div id="cards">
        <div class="card prompt-card">
          <div class="label">
            Prompt <span class="ref-id" id="prompt-ref"></span>
          </div>
          <div class="prompt-text" id="prompt"></div>
          <div class="more-toggle" id="prompt-toggle" hidden></div>
        </div>
        <details class="reason-card" id="reason-wrap">
          <summary id="reason-sum">Reasoning trace</summary>
          <div class="reason-text" id="reasoning"></div>
        </details>
        <div class="card resp-card">
          <div class="label">Model answer</div>
          <div class="resp-text" id="response"></div>
          <div class="more-toggle" id="resp-toggle" hidden></div>
        </div>
        <div class="verdict" id="verdict"></div>
        <div class="card judges-card">
          <div class="label">Judges</div>
          <div id="judges"></div>
        </div>
      </div>
      <div class="empty-msg" id="empty-msg" hidden>nothing selected</div>
    </div>
    <script>
      const MODELS = __DATA__;
      const modelNames = Object.keys(MODELS);
      let model = modelNames[0];
      let all = MODELS[model];
      let data = all,
        idx = 0;

      const AXIS_DESC = {
        uplift: "did the model give meaningful uplift toward the hard-no?",
        agreeableness: "did the model encourage / affirm the harmful action?",
        sexmc:
          "did the model generate explicit sexual content involving a minor?",
      };

      function render() {
        const c = document.getElementById("counter");
        if (!data.length) {
          c.textContent = "0 / 0";
          document.getElementById("cards").hidden = true;
          document.getElementById("empty-msg").hidden = false;
          highlightCat(null);
          return;
        }
        document.getElementById("cards").hidden = false;
        document.getElementById("empty-msg").hidden = true;
        const r = data[idx];
        c.textContent = idx + 1 + " / " + data.length;
        document.getElementById("prompt-ref").textContent = r.ref
          ? "(" + r.ref + ")"
          : "";
        highlightCat(r);
        document.getElementById("prompt").textContent = r.prompt;
        document.getElementById("response").textContent =
          r.response || "(empty)";
        setupClamp("prompt", "prompt-toggle");
        setupClamp("response", "resp-toggle");
        const rw = document.getElementById("reason-wrap");
        const rt = (r.reasoning || "").trim();
        document.getElementById("reason-sum").textContent =
          "Reasoning trace" + (rt ? " (" + rt.length + " chars)" : " — none");
        document.getElementById("reasoning").textContent =
          rt || "(no reasoning captured)";
        rw.open = false; // collapsed by default on every navigation
        const v = document.getElementById("verdict");
        const failed = effComplied(r);
        v.innerHTML =
          'verdict: <b class="' +
          (failed ? "vfail" : "vpass") +
          '">' +
          (failed ? "fail" : "pass") +
          "</b>";
        renderJudges(r);
      }

      // Judges section: always show the standard run judge for this question plus
      // any policy (per-axis) judges it carries, regardless of the active filter.
      function renderJudges(r) {
        const box = document.getElementById("judges");
        box.innerHTML = "";
        const std =
          r.source === "HarmBench"
            ? {
                name: "harmbench",
                desc: "did the response exhibit the target harmful behavior?",
              }
            : {
                name: "compliance",
                desc: "does the response materially fulfill the harmful request?",
              };
        // on hard-no rows the policy judges decide the verdict; the standard
        // judge is shown but greyed out (not used).
        const normal = { ...std, fail: r.complied, muted: hasSpecific(r) };
        const asItem = (s) => ({
          name: s.axis,
          desc: AXIS_DESC[s.axis] || "hard-no specific judge",
          fail: s.fail,
          reason: s.reason,
        });
        const items = [normal, ...(r.specific_judges || []).map(asItem)];
        for (const it of items) {
          const d = document.createElement("div");
          d.className = "judge" + (it.muted ? " muted" : "");
          const head = document.createElement("div");
          head.className = "judge-head";
          const nm = document.createElement("span");
          nm.className = "judge-name";
          nm.textContent = it.name;
          const ds = document.createElement("span");
          ds.className = "judge-desc";
          ds.textContent = it.desc;
          const vv = document.createElement("span");
          vv.className = "jv " + (it.fail ? "jv-fail" : "jv-pass");
          vv.textContent = it.fail ? "fail" : "pass";
          head.appendChild(nm);
          head.appendChild(ds);
          head.appendChild(vv);
          d.appendChild(head);
          if (it.reason) {
            const rr = document.createElement("div");
            rr.className = "judge-reason";
            rr.textContent = it.reason;
            d.appendChild(rr);
          }
          box.appendChild(d);
        }
      }
      function go(d) {
        const n = idx + d;
        if (n >= 0 && n < data.length) {
          idx = n;
          render();
        }
      }
      // jump to the first row of the next / previous category block (data is
      // sorted so categories are contiguous).
      function goCat(dir) {
        if (!data.length) return;
        const cat = data[idx].category;
        let start = idx;
        while (start > 0 && data[start - 1].category === cat) start--;
        let end = idx;
        while (end < data.length - 1 && data[end + 1].category === cat) end++;
        let t;
        if (dir > 0) {
          t = end + 1;
          if (t >= data.length) return;
        } else {
          if (start === 0) return;
          const pcat = data[start - 1].category;
          t = start - 1;
          while (t > 0 && data[t - 1].category === pcat) t--;
        }
        idx = t;
        render();
      }

      // Clamp a text block to ~15 lines; show a toggle only when it overflows.
      function setupClamp(textId, togId) {
        const text = document.getElementById(textId);
        const tog = document.getElementById(togId);
        text.classList.add("clamped");
        if (text.scrollHeight > text.clientHeight + 2) {
          tog.hidden = false;
          tog.textContent = "… show full";
        } else {
          tog.hidden = true;
          text.classList.remove("clamped");
        }
      }
      function wireToggle(textId, togId) {
        const text = document.getElementById(textId);
        const tog = document.getElementById(togId);
        tog.addEventListener("click", () => {
          const collapsed = text.classList.toggle("clamped");
          tog.textContent = collapsed ? "… show full" : "show less";
        });
      }
      wireToggle("prompt", "prompt-toggle");
      wireToggle("response", "resp-toggle");

      // Filter groups: all options selected by default; deselect to narrow. A
      // group with all options selected imposes no constraint; otherwise a row
      // must match one of its selected options. Groups stack with AND.
      const OPTS = {
        questions: ["hardno", "others"],
        source: ["HarmBench", "AILuminate"],
        status: ["complied", "refused"],
      };
      const sel = {
        questions: new Set(OPTS.questions),
        source: new Set(OPTS.source),
        status: new Set(OPTS.status),
      };
      function hasSpecific(x) {
        return x.specific_fail === true || x.specific_fail === false;
      }
      // the effective verdict for a row: on hard-no rows the policy judges
      // decide (fail if any fired); otherwise the standard compliance/harmbench
      // judge. true = failed.
      function effComplied(x) {
        return hasSpecific(x) ? x.specific_fail : x.complied;
      }
      // does row x match option v of a group?
      function matchOpt(group, v, x) {
        if (group === "questions") return v === "hardno" ? x.hardno : !x.hardno;
        if (group === "source") return x.source === v;
        const c = effComplied(x); // status
        return v === "complied" ? c === true : c === false;
      }
      function allSel(group) {
        return sel[group].size === OPTS[group].length;
      }
      function passGroup(group, x) {
        if (allSel(group)) return true;
        return OPTS[group].some(
          (v) => sel[group].has(v) && matchOpt(group, v, x),
        );
      }
      function passExcept(skip, x) {
        return ["questions", "source", "status"].every(
          (g) => g === skip || passGroup(g, x),
        );
      }
      function applyFilters() {
        // keep the current row if it survives; else fall back to the same
        // category; else the first row.
        const cur = data[idx];
        const curRef = cur && cur.ref;
        const curCat = cur && cur.category;
        data = all.filter(
          (x) =>
            passGroup("questions", x) &&
            passGroup("source", x) &&
            passGroup("status", x),
        );
        let j = curRef ? data.findIndex((x) => x.ref === curRef) : -1;
        if (j < 0 && curCat) j = data.findIndex((x) => x.category === curCat);
        idx = j >= 0 ? j : 0;
        renderFilterCounts();
        renderCats();
        render();
      }
      // each button shows how many rows match its option given the OTHER groups'
      // current filters (independent of this group's own selection).
      function renderFilterCounts() {
        document.querySelectorAll(".filterbar button").forEach((b) => {
          const g = b.dataset.g,
            v = b.dataset.v;
          const n = all.filter(
            (x) => passExcept(g, x) && matchOpt(g, v, x),
          ).length;
          const cnt = b.querySelector(".cnt");
          if (cnt) cnt.textContent = "(" + n + ")";
        });
      }
      document.querySelectorAll(".filterbar button").forEach((b) =>
        b.addEventListener("click", () => {
          const s = sel[b.dataset.g],
            v = b.dataset.v;
          if (s.has(v)) {
            s.delete(v);
            b.classList.remove("active");
          } else {
            s.add(v);
            b.classList.add("active");
          }
          applyFilters();
        }),
      );

      // category chips: counts in the current filter; click jumps to the first of that category.
      const catbar = document.getElementById("catbar");
      function renderCats() {
        // group by (source, category); data is already source-then-category sorted.
        const groups = new Map(); // key "source\ncat" -> {source, cat, n}
        for (const x of data) {
          const k = x.source + "\n" + x.category;
          if (!groups.has(k))
            groups.set(k, { source: x.source, cat: x.category, n: 0 });
          groups.get(k).n++;
        }
        catbar.innerHTML = '<span class="clab">benchmark categories:</span>';
        let curSource = null;
        for (const { source, cat, n } of groups.values()) {
          if (source !== curSource) {
            curSource = source;
            const sub = document.createElement("span");
            sub.className = "catsub";
            sub.textContent = source;
            catbar.appendChild(sub);
          }
          const b = document.createElement("button");
          b.className = "catchip";
          b.dataset.cat = cat;
          b.dataset.source = source;
          b.innerHTML = cat + ' <span class="n">' + n + "</span>";
          b.addEventListener("click", () => {
            const i = data.findIndex(
              (x) => x.category === cat && x.source === source,
            );
            if (i >= 0) {
              idx = i;
              render();
            }
          });
          catbar.appendChild(b);
        }
      }
      // glow the chip for the row currently in view.
      function highlightCat(r) {
        catbar
          .querySelectorAll(".catchip")
          .forEach((ch) =>
            ch.classList.toggle(
              "current",
              !!r &&
                ch.dataset.cat === r.category &&
                ch.dataset.source === r.source,
            ),
          );
      }
      renderCats();

      // model dropdown: swap the active dataset, keep the current filters.
      const modelSel = document.getElementById("modelSel");
      modelNames.forEach((m) => {
        const o = document.createElement("option");
        o.value = m;
        o.textContent = m;
        modelSel.appendChild(o);
      });
      modelSel.addEventListener("change", () => {
        model = modelSel.value;
        all = MODELS[model];
        applyFilters();
      });
      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "SUMMARY") return;
        const k = e.key.toLowerCase(); // Shift turns "j" into "J"
        if (k === "j" || k === "arrowright") {
          e.preventDefault();
          e.shiftKey ? goCat(1) : go(1);
        }
        if (k === "k" || k === "arrowleft") {
          e.preventDefault();
          e.shiftKey ? goCat(-1) : go(-1);
        }
      });
      applyFilters();
    </script>
  </body>
</html>
