<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__TITLE__</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        background: #0d1117;
        color: #c9d1d9;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      header {
        background: #161b22;
        border-bottom: 1px solid #30363d;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        color: #e6edf3;
      }
      .counter {
        font-size: 13px;
        color: #8b949e;
        background: #21262d;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid #30363d;
      }
      .nav-hint {
        margin-left: auto;
        font-size: 12px;
        color: #6e7681;
      }
      kbd {
        background: #21262d;
        border: 1px solid #30363d;
        border-radius: 4px;
        padding: 1px 6px;
        font-size: 12px;
        font-family: monospace;
      }
      .filterbar {
        background: #161b22;
        border-bottom: 1px solid #30363d;
        padding: 6px 20px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-shrink: 0;
        font-size: 12px;
        flex-wrap: wrap;
      }
      .glab {
        color: #6e7681;
        margin-right: 4px;
      }
      .filterbar button {
        background: #21262d;
        color: #c9d1d9;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 3px 10px;
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
      }
      .filterbar button.active {
        background: #1f6feb33;
        border-color: #1f6feb;
        color: #79c0ff;
      }
      .filterbar button .cnt {
        color: #6e7681;
      }
      .filterbar button.active .cnt {
        color: #79c0ff;
      }
      .catbar {
        background: #0f1319;
        border-bottom: 1px solid #30363d;
        padding: 6px 20px;
        display: flex;
        gap: 6px;
        align-items: center;
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .clab {
        color: #6e7681;
        font-size: 12px;
        margin-right: 4px;
      }
      .catchip {
        background: #21262d;
        color: #c9d1d9;
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 2px 10px;
        font-size: 12px;
        cursor: pointer;
        font-family: ui-monospace, monospace;
      }
      .catchip:hover {
        border-color: #6e7681;
      }
      .catchip .n {
        color: #6e7681;
        margin-left: 4px;
      }
      .catchip.current {
        background: #8957e533;
        border-color: #8957e5;
        color: #d2a8ff;
      }
      .content {
        flex: 1;
        overflow-y: auto;
        padding: 20px 26px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .verdicts {
        display: grid;
        gap: 14px;
      }
      .card {
        border-radius: 8px;
        padding: 14px 18px;
        border: 1px solid #30363d;
      }
      .vcard .head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .vcard .model {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.3px;
        color: #e6edf3;
      }
      .judge-card {
        background: #1a1512;
      }
      .run-card {
        background: #10151d;
      }
      .flag {
        font-size: 12px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 10px;
      }
      .flag-yes {
        background: #f8514933;
        color: #ff7b72;
        border: 1px solid #f8514966;
      }
      .flag-no {
        background: #23863633;
        color: #7ee787;
        border: 1px solid #23863666;
      }
      .flag-err {
        background: #6e768133;
        color: #8b949e;
        border: 1px solid #6e768166;
      }
      .vcats {
        font-size: 12px;
        color: #d2a8ff;
        font-family: monospace;
        margin-bottom: 6px;
        min-height: 15px;
      }
      .vreason {
        font-size: 13px;
        line-height: 1.5;
        color: #c9d1d9;
        margin-bottom: 8px;
      }
      details.reason {
        background: #0b0e13;
        border: 1px solid #30363d;
        border-radius: 6px;
      }
      details.reason summary {
        cursor: pointer;
        padding: 7px 11px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #b08fe0;
        list-style: none;
        user-select: none;
      }
      details.reason summary::-webkit-details-marker {
        display: none;
      }
      details.reason summary::before {
        content: "\25B8  ";
        color: #6e7681;
      }
      details.reason[open] summary::before {
        content: "\25BE  ";
      }
      details.reason .rtext {
        padding: 0 11px 11px;
        font-size: 12px;
        line-height: 1.5;
        color: #9d8bc0;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-family: ui-monospace, monospace;
      }
      .conv-card {
        background: #161b22;
      }
      .label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 10px;
        color: #8b949e;
      }
      .label .cid {
        color: #6e7681;
        font-family: ui-monospace, monospace;
        text-transform: none;
      }
      .turn {
        margin-bottom: 12px;
      }
      .turn .role {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 3px;
      }
      .role-user {
        color: #ff7b72;
      }
      .role-assistant {
        color: #79c0ff;
      }
      .role-system {
        color: #8b949e;
      }
      .turn .msg {
        font-size: 13px;
        line-height: 1.55;
        color: #c9d1d9;
        white-space: pre-wrap;
        word-wrap: break-word;
        border-left: 2px solid #30363d;
        padding-left: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Monitor viewer</h1>
      <div class="counter" id="counter">0 / 0</div>
      <div class="nav-hint">
        <kbd>J</kbd> next · <kbd>K</kbd> prev · <kbd>⇧</kbd> by category
      </div>
    </header>
    <div class="filterbar" id="filterbar">
      <span class="glab">ruling</span>
      <button class="active" data-v="yes">
        both yes <span class="cnt"></span>
      </button>
      <button class="active" data-v="split">
        split <span class="cnt"></span>
      </button>
      <button class="active" data-v="no">
        both no <span class="cnt"></span>
      </button>
    </div>
    <div class="catbar" id="catbar"><span class="clab">categories:</span></div>
    <div class="content">
      <div class="verdicts" id="verdicts"></div>
      <div class="card conv-card">
        <div class="label">
          Conversation (<span id="turns"></span> turns)
          <span class="cid" id="cid"></span>
        </div>
        <div id="conv"></div>
      </div>
    </div>
    <script>
      const ALL = __DATA__;
      const RULING = ["yes", "split", "no"]; // both-yes / split / both-no
      const sel = new Set(RULING); // all selected by default
      let data = ALL,
        idx = 0;

      const esc = (s) => s || "";
      const catbar = document.getElementById("catbar");
      const verdicts = document.getElementById("verdicts");

      function verdictCard(col) {
        const el = document.createElement("div");
        el.className =
          "card vcard " + (col.kind === "judge" ? "judge-card" : "run-card");
        let flagTxt, fcls;
        if (col.violation === true) {
          flagTxt = "flag";
          fcls = "flag-yes";
        } else if (col.violation === false) {
          flagTxt = "clear";
          fcls = "flag-no";
        } else {
          flagTxt = col.present === false ? "absent" : "error";
          fcls = "flag-err";
        }
        const reasoning = col.reasoning
          ? `<details class="reason"><summary>Reasoning (${col.reasoning.length} chars)</summary><div class="rtext"></div></details>`
          : "";
        el.innerHTML =
          `<div class="head"><span class="model">${esc(col.label)}</span>` +
          `<span class="flag ${fcls}">${flagTxt}</span></div>` +
          `<div class="vcats">${(col.categories || []).join(", ")}</div>` +
          `<div class="vreason"></div>${reasoning}`;
        el.querySelector(".vreason").textContent = col.reason || "";
        if (reasoning) el.querySelector(".rtext").textContent = col.reasoning;
        return el;
      }

      function render() {
        const r = data[idx];
        document.getElementById("counter").textContent = data.length
          ? idx + 1 + " / " + data.length
          : "0 / 0";
        document.getElementById("title").textContent =
          `Monitor viewer (${data.length})`;
        if (!r) {
          verdicts.innerHTML = "";
          document.getElementById("conv").textContent = "(none in filter)";
          document.getElementById("turns").textContent = "0";
          document.getElementById("cid").textContent = "";
          highlightCat(null);
          return;
        }
        verdicts.style.gridTemplateColumns = `repeat(${r.columns.length}, 1fr)`;
        verdicts.innerHTML = "";
        r.columns.forEach((c) => verdicts.appendChild(verdictCard(c)));
        document.getElementById("turns").textContent = r.turns;
        document.getElementById("cid").textContent =
          "(" + r.id.slice(0, 14) + ")";
        const conv = document.getElementById("conv");
        conv.innerHTML = "";
        for (const t of r.conversation) {
          const div = document.createElement("div");
          div.className = "turn";
          const role = document.createElement("div");
          const rl = (t.role || "?").toLowerCase();
          role.className =
            "role role-" +
            (rl === "user" || rl === "assistant" || rl === "system"
              ? rl
              : "system");
          role.textContent = t.role;
          const msg = document.createElement("div");
          msg.className = "msg";
          msg.textContent = t.content || "";
          div.appendChild(role);
          div.appendChild(msg);
          conv.appendChild(div);
        }
        document.querySelector(".content").scrollTop = 0;
        highlightCat(r);
      }

      function go(d) {
        const n = idx + d;
        if (n >= 0 && n < data.length) {
          idx = n;
          render();
        }
      }
      // jump to the first row of the next / previous category block (data is
      // sorted so categories are contiguous).
      function goCat(dir) {
        if (!data.length) return;
        const cat = data[idx].category;
        if (dir > 0) {
          let j = idx;
          while (j < data.length && data[j].category === cat) j++;
          if (j < data.length) {
            idx = j;
            render();
          }
        } else {
          let start = idx;
          while (start > 0 && data[start - 1].category === cat) start--;
          if (idx > start) {
            idx = start;
            render();
            return;
          }
          if (start > 0) {
            const pcat = data[start - 1].category;
            let t = start - 1;
            while (t > 0 && data[t - 1].category === pcat) t--;
            idx = t;
            render();
          }
        }
      }

      function applyFilters() {
        const cur = data[idx];
        const curId = cur && cur.id;
        data = ALL.filter((x) => sel.has(x.ruling));
        let j = curId ? data.findIndex((x) => x.id === curId) : -1;
        idx = j >= 0 ? j : 0;
        renderFilterCounts();
        renderCats();
        render();
      }
      function renderFilterCounts() {
        document.querySelectorAll(".filterbar button").forEach((b) => {
          const n = ALL.filter((x) => x.ruling === b.dataset.v).length;
          b.querySelector(".cnt").textContent = "(" + n + ")";
        });
      }
      document.querySelectorAll(".filterbar button").forEach((b) =>
        b.addEventListener("click", () => {
          const v = b.dataset.v;
          if (sel.has(v)) {
            sel.delete(v);
            b.classList.remove("active");
          } else {
            sel.add(v);
            b.classList.add("active");
          }
          applyFilters();
        }),
      );

      function renderCats() {
        const groups = new Map();
        for (const x of data)
          groups.set(x.category, (groups.get(x.category) || 0) + 1);
        catbar.innerHTML = '<span class="clab">categories:</span>';
        for (const [cat, n] of groups) {
          const b = document.createElement("button");
          b.className = "catchip";
          b.dataset.cat = cat;
          b.innerHTML = cat + ' <span class="n">' + n + "</span>";
          b.addEventListener("click", () => {
            const i = data.findIndex((x) => x.category === cat);
            if (i >= 0) {
              idx = i;
              render();
            }
          });
          catbar.appendChild(b);
        }
      }
      function highlightCat(r) {
        catbar
          .querySelectorAll(".catchip")
          .forEach((ch) =>
            ch.classList.toggle(
              "current",
              !!r && ch.dataset.cat === r.category,
            ),
          );
      }

      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "SUMMARY") return;
        const k = e.key.toLowerCase();
        if (k === "j" || k === "arrowright") {
          e.preventDefault();
          e.shiftKey ? goCat(1) : go(1);
        }
        if (k === "k" || k === "arrowleft") {
          e.preventDefault();
          e.shiftKey ? goCat(-1) : go(-1);
        }
      });

      applyFilters();
    </script>
  </body>
</html>
